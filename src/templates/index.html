<!DOCTYPE html>
<html>
<head>
    <title>Real/Fake Detector</title>
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background: radial-gradient(circle, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            margin-top: 50px;
            font-size: 3em;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }
        .upload-box {
            margin: 20px auto;
            padding: 20px;
            border: 2px dashed #fff;
            border-radius: 10px;
            width: 300px;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .upload-box:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        #image-container {
            margin: 20px auto;
            width: 300px;
            height: 300px;
            display: none;
        }
        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        #result {
            margin-top: 20px;
            font-size: 1.5em;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .loading {
            display: none;
            font-size: 1.2em;
            color: #ff0;
        }
        .error {
            color: #f00;
        }
        .real {
            color: #0f0;
        }
        .fake {
            color: #f00;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }
    </style>
</head>
<body>
    <h1>Image Authenticity Check</h1>
    
    <div class="upload-box">
        <input type="file" id="fileInput" accept="image/jpeg,image/png">
        <p>Click to upload image</p>
        <p>(JPEG, PNG formats supported)</p>
    </div>
    
    <div id="image-container">
        <img id="preview" src="#" alt="Image preview">
    </div>
    
    <div id="result"></div>
    <div class="loading" id="loading">Processing image...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const resultDiv = document.getElementById('result');
        const loadingDiv = document.getElementById('loading');

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                // Validate file type
                if (!file.type.match('image/jpeg') && !file.type.match('image/png')) {
                    resultDiv.innerHTML = 'Error: Please upload only JPEG or PNG images';
                    resultDiv.className = 'error';
                    return;
                }

                // Reset previous results
                resultDiv.innerHTML = '';
                resultDiv.className = '';
                loadingDiv.style.display = 'block';

                // Show preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.style.display = 'block';
                    preview.src = e.target.result;
                }
                reader.readAsDataURL(file);

                try {
                    // Send to server
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch('/predict', {
                        method: 'POST',
                        body: formData
                    });

                    loadingDiv.style.display = 'none';

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    if (data.error) {
                        resultDiv.innerHTML = `Error: ${data.error}`;
                        resultDiv.className = 'error';
                    } else {
                        resultDiv.innerHTML = `
                            <h2>Result: ${data.prediction}</h2>
                            <p>Confidence: ${data.confidence}</p>
                        `;
                        resultDiv.className = data.prediction.toLowerCase();
                    }
                } catch (error) {
                    console.error('Error:', error);
                    loadingDiv.style.display = 'none';
                    resultDiv.innerHTML = `Error: ${error.message}`;
                    resultDiv.className = 'error';
                }
            }
        });

        // Three.js 3D background
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const torusKnot = new THREE.Mesh(geometry, material);
        scene.add(torusKnot);

        camera.position.z = 50;

        function animate() {
            requestAnimationFrame(animate);
            torusKnot.rotation.x += 0.01;
            torusKnot.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
